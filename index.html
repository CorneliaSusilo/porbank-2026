<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <title>PORBANK 2026</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #020617; font-family: Inter, Arial, sans-serif; }
    .page { position: relative; width: min(430px, 100%); aspect-ratio: 9 / 16; max-height: 92vh; overflow: hidden; border-radius: 32px; color: white; background: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=85') center/cover; box-shadow: 0 25px 60px rgba(0,0,0,.5); }
    .page::before { content: ''; position: absolute; inset: 0; background: rgba(2,6,23,.65); }
    .page::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at top, rgba(59,130,246,.35), transparent 48%); }
    .content { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px; animation: enter .7s ease-out; }
    .logo { height: 160px; width: auto; margin-bottom: 32px; overflow: visible; filter: drop-shadow(0 18px 22px rgba(0,0,0,.35)); transition: transform .45s ease; }
    h1 { margin: 0 0 20px; font-size: clamp(36px, 10vw, 48px); line-height: 1.05; letter-spacing: -.03em; text-shadow: 0 4px 14px rgba(0,0,0,.55); }
    p { margin: 0 0 36px; max-width: 300px; color: #e2e8f0; line-height: 1.5; }
    button { height: 56px; padding: 0 40px; border: 0; border-radius: 999px; color: white; background: #3b82f6; font-size: 16px; font-weight: 800; letter-spacing: .2em; cursor: pointer; box-shadow: 0 12px 28px rgba(15,23,42,.5); transition: transform .2s, background .2s; }
    button:hover { transform: scale(1.05); background: #60a5fa; } button:active { transform: scale(.95); } .play { margin-right: 8px; }
    .started .logo { transform: scale(1.08); } .started p, .started button { display: none; }
    @keyframes enter { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    @media (max-height: 700px) { .logo { height: 125px; margin-bottom: 22px; } h1 { font-size: 34px; } p { margin-bottom: 24px; } }
  </style>
</head>
<body>
  <main class="page" id="page">
    <section class="content">
<img class="logo" src="logo-porbank.png" alt="Logo BMPD Kalimantan Selatan">
      
      <h1>WELCOME TO PORBANK 2026</h1>
      <p>Click the button below to begin your experience.</p>
      <button id="start" type="button" aria-label="Start PORBANK 2026"><span class="play">▶</span>START</button>
    </section>
  </main>
  <script>
    document.getElementById('start').addEventListener('click', function () { document.getElementById('page').classList.add('started'); });
  </script>
</body>
</html>
